<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocaify - LinkedIn Sourcing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 400px;
            min-height: 500px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            padding: 0;
        }

        .header {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .tagline {
            font-size: 12px;
            opacity: 0.8;
        }

        .container {
            padding: 20px;
        }

        .status {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-dot.offline {
            background: #ef4444;
            animation: none;
        }

        .candidate-card {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .candidate-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .candidate-title {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .candidate-info {
            font-size: 12px;
            opacity: 0.7;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 13px;
            text-align: center;
        }

        .success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.4);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 13px;
            text-align: center;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .not-linkedin {
            text-align: center;
            padding: 40px 20px;
            opacity: 0.8;
        }

        .not-linkedin-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .footer {
            text-align: center;
            padding: 15px;
            font-size: 11px;
            opacity: 0.6;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🎯 Vocaify</div>
        <div class="tagline">AI Destekli İşe Alım Asistanı</div>
    </div>

    <div class="container">
        <div class="status">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">LinkedIn taranıyor...</span>
            </div>
        </div>

        <div id="errorMessage" class="error hidden"></div>
        <div id="successMessage" class="success hidden"></div>

        <!-- LinkedIn'de değilse -->
        <div id="notLinkedIn" class="not-linkedin hidden">
            <div class="not-linkedin-icon">🔍</div>
            <p style="margin-bottom: 10px;">LinkedIn profil sayfasında değilsiniz</p>
            <p style="font-size: 12px; opacity: 0.7;">Bu eklenti LinkedIn'deki aday profillerinden bilgi çeker.</p>
        </div>

        <!-- Aday kartı -->
        <div id="candidateCard" class="candidate-card hidden">
            <div class="candidate-name" id="candidateName">-</div>
            <div class="candidate-title" id="candidateTitle">-</div>
            <div class="candidate-info" id="candidateInfo">LinkedIn'den alınıyor...</div>
        </div>

        <!-- Butonlar -->
        <div id="actionButtons" class="hidden">
            <button class="btn btn-primary" id="addToVocaify">
                <span>➕</span>
                <span>Vocaify'a Ekle</span>
            </button>
            <button class="btn btn-secondary" id="refreshData">
                <span>🔄</span>
                <span>Yenile</span>
            </button>
        </div>
    </div>

    <div class="footer">
        AŞAMA 29: Chrome Extension v1.0.0
    </div>

    <script src="popup.js"></script>
</body>
</html>
